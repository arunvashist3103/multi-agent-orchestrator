services:
  db:
    image: postgres: 16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-checkpoints}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data: /var/lib/postgresql/data
    health_check:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-checkpoints}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      env_file:
        - path: .env
          required: false 
      environment:  
        DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-checkpoints}
      ports:
       - "8000:8000"
      health_check:
        test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
  postgres_data:

